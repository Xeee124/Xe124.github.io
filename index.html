<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FFT WASM Evolver</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050805;
      --panel: #0b120b;
      --panel2: #091009;
      --border: #214021;
      --text: #dbffdb;
      --muted: #8fb38f;
      --accent: #7dff7d;
      --accent2: #ff7d7d;
      --warn: #ffd27d;
    }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { padding: 14px; box-sizing: border-box; }
    h1 { margin: 0 0 10px; font-size: 18px; color: var(--accent); }
    .grid { display: grid; gap: 10px; grid-template-columns: 1.2fr 1fr; }
    .panel { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--border); border-radius: 10px; padding: 10px; box-sizing: border-box; }
    .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
    label { display: inline-flex; gap: 6px; align-items: center; }
    select, button { background: #071107; color: var(--text); border: 1px solid #355635; border-radius: 8px; padding: 6px 8px; font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .35; cursor: not-allowed; }
    .stat { display: inline-flex; gap: 6px; align-items: baseline; min-width: 170px; }
    .key { color: var(--muted); }
    .warn { color: var(--warn); }
    .ok { color: var(--accent); }
    .bad { color: var(--accent2); }
    #plot { width: 100%; height: 240px; display: block; background: #040704; border: 1px solid #183018; border-radius: 8px; }
    #log { height: 320px; overflow: auto; white-space: pre-wrap; background: #020402; border: 1px solid #183018; border-radius: 8px; padding: 8px; line-height: 1.35; font-size: 12px; }
    .small { font-size: 12px; color: var(--muted); line-height: 1.45; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>FFT WASM Evolver</h1>
  <div class="panel">
    <div class="row">
      <label>N
        <select id="n">
          <option>64</option><option>128</option><option>256</option><option>512</option>
          <option>1024</option><option selected>2048</option><option>4096</option><option>8192</option>
          <option>16384</option><option>32768</option><option>65536</option><option>131072</option>
          <option>262144</option><option>524288</option>
        </select>
      </label>
      <label>bit深度
        <select id="bit">
          <option value="f32">f32</option>
          <option value="f64" selected>f64</option>
        </select>
      </label>
      <label>選択モード
        <select id="selmode">
          <option value="err" selected>精度優先</option>
          <option value="mix">精度→速度</option>
        </select>
      </label>
      <button id="start">開始</button>
      <button id="stop" disabled>停止</button>
      <button id="reset">リセット</button>
      <span class="warn">WAT を毎世代コンパイルし、テーブル精度と並びを変異させます。</span>
    </div>
    <div style="margin-top:10px" class="row">
      <span class="stat"><span class="key">世代</span><b id="gen">0</b></span>
      <span class="stat"><span class="key">最良NRMSE</span><b id="best">-</b></span>
      <span class="stat"><span class="key">最新NRMSE</span><b id="lastErr">-</b></span>
      <span class="stat"><span class="key">平均実行ms</span><b id="avgRun">-</b></span>
      <span class="stat"><span class="key">平均compile ms</span><b id="avgCmp">-</b></span>
      <span class="stat"><span class="key">状態</span><b id="state">待機</b></span>
    </div>
    <div style="margin-top:8px" class="small" id="candInfo">candidate: -</div>
  </div>

  <div class="grid" style="margin-top:10px;">
    <div class="panel"><canvas id="plot" width="1200" height="240"></canvas></div>
    <div class="panel"><div id="log"></div></div>
  </div>

  <div class="panel small" style="margin-top:10px;">
    この版は radix-2 FFT を WASM に入れ、twiddle テーブルの量子化と並び順だけを世代ごとに変えます。入力は固定 seed、評価は JS の参照 FFT との NRMSE です。
  </div>

  <script type="module">
    import { WABT } from 'https://code4fukui.github.io/WABT-es/WABT.js';

    const $ = (id) => document.getElementById(id);
    const el = {
      n: $('n'), bit: $('bit'), selmode: $('selmode'),
      start: $('start'), stop: $('stop'), reset: $('reset'),
      gen: $('gen'), best: $('best'), lastErr: $('lastErr'),
      avgRun: $('avgRun'), avgCmp: $('avgCmp'),
      state: $('state'), candInfo: $('candInfo'),
      log: $('log'), plot: $('plot')
    };
    const ctx = el.plot.getContext('2d');

    let wabt = null;
    let running = false;
    let generation = 0;
    let elite = null;
    let history = [];
    const MAX_LOG = 5000;
    const MAX_POINTS = 120;
    const INPUT_SEED = 0xC0FFEE;
    const RUN_REPEATS = 3;

    function logLine(...args) {
      const s = args.map(v => typeof v === 'string' ? v : String(v)).join(' ');
      el.log.textContent += s + '\n';
      if (el.log.textContent.length > MAX_LOG) el.log.textContent = el.log.textContent.slice(-MAX_LOG);
      el.log.scrollTop = el.log.scrollHeight;
    }

    function setState(text, cls = '') {
      el.state.textContent = text;
      el.state.className = cls;
    }

    function nextFrame() {
      return new Promise(r => requestAnimationFrame(() => r()));
    }

    function isPowerOfTwo(n) {
      return n > 0 && (n & (n - 1)) === 0;
    }

    function log2Int(n) {
      return Math.round(Math.log2(n));
    }

    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    function mulberry32(seed) {
      let t = seed >>> 0;
      return function() {
        t += 0x6D2B79F5;
        let x = t;
        x = Math.imul(x ^ x >>> 15, x | 1);
        x ^= x + Math.imul(x ^ x >>> 7, x | 61);
        return ((x ^ x >>> 14) >>> 0) / 4294967296;
      };
    }

    function pick(arr) {
      return arr[(Math.random() * arr.length) | 0];
    }

    function quantize(v, bits, type) {
      if (type === 'f32') return Math.fround(v);
      if (bits >= 52) return v;
      const step = Math.pow(2, -bits);
      return Math.round(v / step) * step;
    }

    function bitReverseIndex(v, bits) {
      let r = 0;
      for (let i = 0; i < bits; i++) {
        r = (r << 1) | (v & 1);
        v >>>= 1;
      }
      return r >>> 0;
    }

    function fftReference(reIn, imIn) {
      const n = reIn.length;
      const re = new Float64Array(reIn);
      const im = new Float64Array(imIn);
      let j = 0;
      for (let i = 1; i < n; i++) {
        let bit = n >> 1;
        while (j & bit) { j ^= bit; bit >>= 1; }
        j ^= bit;
        if (i < j) {
          [re[i], re[j]] = [re[j], re[i]];
          [im[i], im[j]] = [im[j], im[i]];
        }
      }
      for (let len = 2; len <= n; len <<= 1) {
        const half = len >> 1;
        const step = -2 * Math.PI / len;
        for (let i = 0; i < n; i += len) {
          for (let k = 0; k < half; k++) {
            const ang = step * k;
            const wr = Math.cos(ang);
            const wi = Math.sin(ang);
            const p = i + k;
            const q = p + half;
            const ur = re[p], ui = im[p];
            const vr = re[q], vi = im[q];
            const tr = vr * wr - vi * wi;
            const ti = vr * wi + vi * wr;
            re[p] = ur + tr;
            im[p] = ui + ti;
            re[q] = ur - tr;
            im[q] = ui - ti;
          }
        }
      }
      return { re, im };
    }

    function buildInput(n, seed) {
      const rnd = mulberry32(seed);
      const re = new Float64Array(n);
      const im = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const t = i / n;
        re[i] = Math.sin(2 * Math.PI * (3 * t + 0.07))
              + 0.5 * Math.sin(2 * Math.PI * (17 * t + 0.33))
              + 0.2 * Math.cos(2 * Math.PI * (61 * t + 0.19))
              + (rnd() - 0.5) * 0.15;
        im[i] = 0.35 * Math.sin(2 * Math.PI * (5 * t + 0.12)) + (rnd() - 0.5) * 0.05;
      }
      return { re, im };
    }

    function randomOddBelow(n2) {
      const mask = n2 - 1;
      let v = (((Math.random() * n2) | 0) | 1) & mask;
      if ((v & 1) === 0) v = (v + 1) & mask;
      return v === 0 ? 1 : v;
    }

    function randomCandidate(n, type) {
      const maxBits = type === 'f32' ? 23 : 52;
      const base = type === 'f32' ? 12 : 28;
      return {
        n,
        type,
        n2Bits: log2Int(n >>> 1),
        tableBits: clamp(base + (((Math.random() * 7) | 0) - 2), 2, maxBits),
        permMode: (Math.random() * 4) | 0,
        strideOdd: randomOddBelow(n >>> 1)
      };
    }

    function mutateCandidate(parent, n, type, mode) {
      const child = { ...parent, n, type, n2Bits: log2Int(n >>> 1) };
      const maxBits = type === 'f32' ? 23 : 52;
      const minBits = type === 'f32' ? 4 : 8;
      if (Math.random() < 0.8) child.tableBits = clamp(child.tableBits + pick([-3, -2, -1, 1, 2, 3]), minBits, maxBits);
      if (Math.random() < 0.5) child.permMode = (child.permMode + pick([1, 2, 3])) % 4;
      if (Math.random() < 0.55) {
        const n2 = n >>> 1;
        let v = (child.strideOdd + pick([-15, -9, -7, -3, 3, 7, 9, 15])) & (n2 - 1);
        if ((v & 1) === 0) v = (v + 1) & (n2 - 1);
        if (v === 0) v = 1;
        child.strideOdd = v;
      }
      if (mode === 'mix' && Math.random() < 0.25) child.tableBits = clamp(child.tableBits + pick([-1, 1]), minBits, maxBits);
      return child;
    }

    function candidateLabel(c) {
      return `bits=${c.tableBits} / mode=${['natural', 'reverse', 'bitrev', 'stride'][c.permMode] || 'natural'} / stride=${c.strideOdd}`;
    }

    function memoryPagesNeeded(n, type) {
      const elemBytes = type === 'f32' ? 4 : 8;
      const bytes = n * elemBytes * 2 + (n >>> 1) * 2 * elemBytes + 65536;
      return Math.ceil(bytes / 65536);
    }

    function twiddleTable(n, type, cand) {
      const n2 = n >>> 1;
      const table = new Float64Array(n2 * 2);
      for (let k = 0; k < n2; k++) {
        const ang = -2 * Math.PI * k / n;
        const wr = quantize(Math.cos(ang), cand.tableBits, type);
        const wi = quantize(Math.sin(ang), cand.tableBits, type);
        let phys = k;
        if (cand.permMode === 1) phys = n2 - 1 - k;
        else if (cand.permMode === 2) phys = bitReverseIndex(k, cand.n2Bits);
        else if (cand.permMode === 3) phys = (Math.imul(k, cand.strideOdd) & (n2 - 1)) >>> 0;
        table[phys * 2] = wr;
        table[phys * 2 + 1] = wi;
      }
      return table;
    }

    function toWatBytes(values, type) {
      const bytesPer = type === 'f32' ? 4 : 8;
      const out = new Uint8Array(values.length * bytesPer);
      const dv = new DataView(out.buffer);
      for (let i = 0; i < values.length; i++) {
        if (type === 'f32') dv.setFloat32(i * 4, values[i], true);
        else dv.setFloat64(i * 8, values[i], true);
      }
      return out;
    }

    function bytesToWatString(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i++) {
        s += '\\' + bytes[i].toString(16).padStart(2, '0');
      }
      return '"' + s + '"';
    }

    function watForCandidate(n, type, cand, twiddleBytes) {
      const elem = type === 'f32' ? 'f32' : 'f64';
      const load = type === 'f32' ? 'f32.load' : 'f64.load';
      const store = type === 'f32' ? 'f32.store' : 'f64.store';
      const add = type === 'f32' ? 'f32.add' : 'f64.add';
      const sub = type === 'f32' ? 'f32.sub' : 'f64.sub';
      const mul = type === 'f32' ? 'f32.mul' : 'f64.mul';
      const elemShift = type === 'f32' ? 2 : 3;
      const complexShift = type === 'f32' ? 3 : 4;
      const rePtr = 0;
      const imPtr = n * (type === 'f32' ? 4 : 8);
      const twPtr = imPtr + n * (type === 'f32' ? 4 : 8);
      const pages = memoryPagesNeeded(n, type);
      const twData = bytesToWatString(twiddleBytes);

      const lines = [];
      const push = (...xs) => lines.push(...xs);

      push('(module');
      push(`  (memory (export "memory") ${pages})`);
      push(`  (global $N i32 (i32.const ${n}))`);
      push(`  (global $TWPTR i32 (i32.const ${twPtr}))`);
      push(`  (global $REPTR i32 (i32.const ${rePtr}))`);
      push(`  (global $IMPTR i32 (i32.const ${imPtr}))`);
      push('');
      push('  (func $bitrev (param $x i32) (param $bits i32) (result i32)');
      push('    (local $r i32)');
      push('    (local $i i32)');
      push('    i32.const 0');
      push('    local.set $r');
      push('    i32.const 0');
      push('    local.set $i');
      push('    block $done');
      push('      loop $loop');
      push('        local.get $i');
      push('        local.get $bits');
      push('        i32.ge_u');
      push('        br_if $done');
      push('        local.get $r');
      push('        i32.const 1');
      push('        i32.shl');
      push('        local.get $x');
      push('        i32.const 1');
      push('        i32.and');
      push('        i32.or');
      push('        local.set $r');
      push('        local.get $x');
      push('        i32.const 1');
      push('        i32.shr_u');
      push('        local.set $x');
      push('        local.get $i');
      push('        i32.const 1');
      push('        i32.add');
      push('        local.set $i');
      push('        br $loop');
      push('      end');
      push('    end');
      push('    local.get $r');
      push('  )');
      push('');
      push(`  (func (export "fft") (param $re i32) (param $im i32)`);
      push('    (local $i i32)');
      push('    (local $j i32)');
      push('    (local $bit i32)');
      push('    (local $len i32)');
      push('    (local $half i32)');
      push('    (local $step i32)');
      push('    (local $k i32)');
      push('    (local $twIdx i32)');
      push('    (local $addr0 i32)');
      push('    (local $addr1 i32)');
      push('    (local $addr2 i32)');
      push('    (local $addr3 i32)');
      push(`    (local $ur ${elem})`);
      push(`    (local $ui ${elem})`);
      push(`    (local $vr ${elem})`);
      push(`    (local $vi ${elem})`);
      push(`    (local $tr ${elem})`);
      push(`    (local $ti ${elem})`);
      push(`    (local $wr ${elem})`);
      push(`    (local $wi ${elem})`);
      push('');
      push('    ;; bit-reversal permutation');
      push('    i32.const 1');
      push('    local.set $i');
      push('    i32.const 0');
      push('    local.set $j');
      push('    block $outerDone');
      push('      loop $outer');
      push('        local.get $i');
      push('        global.get $N');
      push('        i32.ge_u');
      push('        br_if $outerDone');
      push('        local.get $i');
      push('        local.get $j');
      push('        i32.lt_u');
      push('        if');
      push(`          local.get $re`);
      push('          local.get $i');
      push(`          i32.const ${elemShift}`);
      push('          i32.shl');
      push('          i32.add');
      push('          local.set $addr0');
      push(`          local.get $im`);
      push('          local.get $i');
      push(`          i32.const ${elemShift}`);
      push('          i32.shl');
      push('          i32.add');
      push('          local.set $addr1');
      push(`          local.get $re`);
      push('          local.get $j');
      push(`          i32.const ${elemShift}`);
      push('          i32.shl');
      push('          i32.add');
      push('          local.set $addr2');
      push(`          local.get $im`);
      push('          local.get $j');
      push(`          i32.const ${elemShift}`);
      push('          i32.shl');
      push('          i32.add');
      push('          local.set $addr3');
      push('          local.get $addr0');
      push(`          ${load}`);
      push('          local.set $ur');
      push('          local.get $addr1');
      push(`          ${load}`);
      push('          local.set $ui');
      push('          local.get $addr2');
      push(`          ${load}`);
      push('          local.set $vr');
      push('          local.get $addr3');
      push(`          ${load}`);
      push('          local.set $vi');
      push('          local.get $addr0');
      push('          local.get $vr');
      push(`          ${store}`);
      push('          local.get $addr1');
      push('          local.get $vi');
      push(`          ${store}`);
      push('          local.get $addr2');
      push('          local.get $ur');
      push(`          ${store}`);
      push('          local.get $addr3');
      push('          local.get $ui');
      push(`          ${store}`);
      push('        end');
      push('        global.get $N');
      push('        i32.const 1');
      push('        i32.shr_u');
      push('        local.set $bit');
      push('        block $bitDone');
      push('          loop $bitLoop');
      push('            local.get $j');
      push('            local.get $bit');
      push('            i32.and');
      push('            i32.eqz');
      push('            br_if $bitDone');
      push('            local.get $j');
      push('            local.get $bit');
      push('            i32.sub');
      push('            local.set $j');
      push('            local.get $bit');
      push('            i32.const 1');
      push('            i32.shr_u');
      push('            local.set $bit');
      push('            br $bitLoop');
      push('          end');
      push('        end');
      push('        local.get $j');
      push('        local.get $bit');
      push('        i32.add');
      push('        local.set $j');
      push('        local.get $i');
      push('        i32.const 1');
      push('        i32.add');
      push('        local.set $i');
      push('        br $outer');
      push('      end');
      push('    end');
      push('');
      push('    ;; iterative radix-2 FFT');
      push('    i32.const 2');
      push('    local.set $len');
      push('    block $stageDone');
      push('      loop $stage');
      push('        local.get $len');
      push('        global.get $N');
      push('        i32.gt_u');
      push('        br_if $stageDone');
      push('        local.get $len');
      push('        i32.const 1');
      push('        i32.shr_u');
      push('        local.set $half');
      push('        global.get $N');
      push('        local.get $len');
      push('        i32.div_u');
      push('        local.set $step');
      push('        i32.const 0');
      push('        local.set $k');
      push('        block $kDone');
      push('          loop $kLoop');
      push('            local.get $k');
      push('            global.get $N');
      push('            i32.ge_u');
      push('            br_if $kDone');
      push('            i32.const 0');
      push('            local.set $j');
      push('            block $jDone');
      push('              loop $jLoop');
      push('                local.get $j');
      push('                local.get $half');
      push('                i32.ge_u');
      push('                br_if $jDone');
      push('                local.get $j');
      push('                local.get $step');
      push('                i32.mul');
      push('                local.set $twIdx');
      push('                global.get $TWPTR');
      push('                local.get $twIdx');
      push(f'                i32.const {complexShift}');
      push('                i32.shl');
      push('                i32.add');
      push('                local.set $addr0');
      push('                local.get $addr0');
      push(f'                {load}');
      push('                local.set $wr');
      push('                local.get $addr0');
      push(f'                i32.const {type == "f32" and 4 or 8}');
      push('                i32.add');
      push(f'                {load}');
      push('                local.set $wi');
      push('                local.get $k');
      push('                local.get $j');
      push('                i32.add');
      push(f'                i32.const {elemShift}');
      push('                i32.shl');
      push('                local.set $addr0');
      push('                local.get $k');
      push('                local.get $j');
      push('                i32.add');
      push('                local.get $half');
      push('                i32.add');
      push(f'                i32.const {elemShift}');
      push('                i32.shl');
      push('                local.set $addr1');
      push('                local.get $re');
      push('                local.get $addr0');
      push('                i32.add');
      push('                local.set $addr2');
      push('                local.get $im');
      push('                local.get $addr0');
      push('                i32.add');
      push('                local.set $addr3');
      push('                local.get $re');
      push('                local.get $addr1');
      push('                i32.add');
      push('                local.set $addr0');
      push('                local.get $im');
      push('                local.get $addr1');
      push('                i32.add');
      push('                local.set $addr1');
      push('                local.get $addr2');
      push(f'                {load}');
      push('                local.set $ur');
      push('                local.get $addr3');
      push(f'                {load}');
      push('                local.set $ui');
      push('                local.get $addr0');
      push(f'                {load}');
      push('                local.set $vr');
      push('                local.get $addr1');
      push(f'                {load}');
      push('                local.set $vi');
      push('                local.get $vr');
      push('                local.get $wr');
      push(f'                {mul}');
      push('                local.get $vi');
      push('                local.get $wi');
      push(f'                {mul}');
      push(f'                {sub}');
      push('                local.set $tr');
      push('                local.get $vr');
      push('                local.get $wi');
      push(f'                {mul}');
      push('                local.get $vi');
      push('                local.get $wr');
      push(f'                {mul}');
      push(f'                {add}');
      push('                local.set $ti');
      push('                local.get $addr2');
      push('                local.get $ur');
      push('                local.get $tr');
      push(f'                {add}');
      push(f'                {store}');
      push('                local.get $addr3');
      push('                local.get $ui');
      push('                local.get $ti');
      push(f'                {add}');
      push(f'                {store}');
      push('                local.get $addr0');
      push('                local.get $ur');
      push('                local.get $tr');
      push(f'                {sub}');
      push(f'                {store}');
      push('                local.get $addr1');
      push('                local.get $ui');
      push('                local.get $ti');
      push(f'                {sub}');
      push(f'                {store}');
      push('                local.get $j');
      push('                i32.const 1');
      push('                i32.add');
      push('                local.set $j');
      push('                br $jLoop');
      push('              end');
      push('            end');
      push('            local.get $k');
      push('            local.get $len');
      push('            i32.add');
      push('            local.set $k');
      push('            br $kLoop');
      push('          end');
      push('        end');
      push('        local.get $len');
      push('        i32.const 1');
      push('        i32.shl');
      push('        local.set $len');
      push('        br $stage');
      push('      end');
      push('    end');
      push('  )');
      push('');
      push(`  (data (i32.const ${twPtr}) ${twData})`);
      push(')');
      return lines.join('\n');
    }

    function writeInputToMemory(mem, re, im, type) {
      const elemBytes = type === 'f32' ? 4 : 8;
      const rePtr = 0;
      const imPtr = re.length * elemBytes;
      const dv = new DataView(mem.buffer);
      for (let i = 0; i < re.length; i++) {
        if (type === 'f32') {
          dv.setFloat32(rePtr + i * 4, re[i], true);
          dv.setFloat32(imPtr + i * 4, im[i], true);
        } else {
          dv.setFloat64(rePtr + i * 8, re[i], true);
          dv.setFloat64(imPtr + i * 8, im[i], true);
        }
      }
      return { rePtr, imPtr };
    }

    function readOutput(mem, n, type) {
      const elemBytes = type === 'f32' ? 4 : 8;
      const re = new Float64Array(n);
      const im = new Float64Array(n);
      const dv = new DataView(mem.buffer);
      const rePtr = 0;
      const imPtr = n * elemBytes;
      for (let i = 0; i < n; i++) {
        if (type === 'f32') {
          re[i] = dv.getFloat32(rePtr + i * 4, true);
          im[i] = dv.getFloat32(imPtr + i * 4, true);
        } else {
          re[i] = dv.getFloat64(rePtr + i * 8, true);
          im[i] = dv.getFloat64(imPtr + i * 8, true);
        }
      }
      return { re, im };
    }

    function rmseCompared(aRe, aIm, bRe, bIm) {
      let sum = 0;
      let energy = 0;
      for (let i = 0; i < aRe.length; i++) {
        const dr = aRe[i] - bRe[i];
        const di = aIm[i] - bIm[i];
        sum += dr * dr + di * di;
        energy += bRe[i] * bRe[i] + bIm[i] * bIm[i];
      }
      const rmse = Math.sqrt(sum / (2 * aRe.length));
      const nrmse = rmse / (Math.sqrt(energy / (2 * aRe.length)) + 1e-30);
      return { rmse, nrmse };
    }

    function updatePlot() {
      const w = el.plot.width, h = el.plot.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#040704';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#183018';
      ctx.beginPath();
      for (let i = 0; i <= 8; i++) {
        const y = 10 + (h - 20) * i / 8;
        ctx.moveTo(0, y); ctx.lineTo(w, y);
      }
      ctx.stroke();
      const start = Math.max(0, history.length - MAX_POINTS);
      const slice = history.slice(start);
      if (!slice.length) return;
      const vals = slice.flatMap(v => [v.run, v.cmp, v.err]);
      let maxV = Math.max(...vals, 1e-12);
      if (!Number.isFinite(maxV) || maxV <= 0) maxV = 1;
      const padL = 50, padR = 10, padT = 10, padB = 24;
      const pw = w - padL - padR, ph = h - padT - padB;
      const series = [
        { key: 'run', color: '#7dff7d', label: 'run ms' },
        { key: 'cmp', color: '#7db7ff', label: 'compile ms' },
        { key: 'err', color: '#ff7d7d', label: 'nrmse' }
      ];
      for (const s of series) {
        ctx.strokeStyle = s.color;
        ctx.beginPath();
        slice.forEach((v, i) => {
          const x = padL + (slice.length === 1 ? 0 : i / (slice.length - 1) * pw);
          const y = padT + ph - (v[s.key] / maxV) * ph;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }
      ctx.fillStyle = '#9bbf9b';
      ctx.font = '12px monospace';
      ctx.fillText(`max=${maxV.toExponential(2)}`, 10, 16);
    }

    async function compileAndRunCandidate(n, type, cand, baseInput, ref) {
      const tw = twiddleTable(n, type, cand);
      const twBytes = toWatBytes(tw, type);
      const wat = watForCandidate(n, type, cand, twBytes);
      const t0 = performance.now();
      const mod = wabt.parseWat('fft_evolver.wat', wat);
      const bin = mod.toBinary({ log: false, write_debug_names: true });
      const compileMs = performance.now() - t0;
      const instance = await WebAssembly.instantiate(bin.buffer, {});
      const exports = instance.instance ? instance.instance.exports : instance.exports;
      const mem = exports.memory;
      const fft = exports.fft;
      const ptrs = writeInputToMemory(mem, baseInput.re, baseInput.im, type);
      const runTimes = [];
      let out = null;
      for (let r = 0; r < RUN_REPEATS; r++) {
        writeInputToMemory(mem, baseInput.re, baseInput.im, type);
        const rt0 = performance.now();
        fft(ptrs.rePtr, ptrs.imPtr);
        const rt1 = performance.now();
        runTimes.push(rt1 - rt0);
        out = readOutput(mem, n, type);
      }
      const avgRun = runTimes.reduce((a, b) => a + b, 0) / runTimes.length;
      const err = rmseCompared(out.re, out.im, ref.re, ref.im);
      return { compileMs, avgRun, ...err, binaryBytes: bin.buffer.byteLength };
    }

    function shouldAccept(next, best, mode) {
      if (!best) return true;
      if (next.err < best.err * 0.9995) return true;
      if (Math.abs(next.err - best.err) <= best.err * 0.0015) {
        return mode === 'mix' ? next.run < best.run : next.cmp < best.cmp;
      }
      return false;
    }

    function updateStats(best, last) {
      el.gen.textContent = String(generation);
      el.best.textContent = best ? best.err.toExponential(4) : '-';
      el.lastErr.textContent = last ? last.err.toExponential(4) : '-';
      el.avgRun.textContent = history.length ? (history.reduce((a, b) => a + b.run, 0) / history.length).toFixed(4) : '-';
      el.avgCmp.textContent = history.length ? (history.reduce((a, b) => a + b.cmp, 0) / history.length).toFixed(1) : '-';
      el.candInfo.textContent = best ? `elite: ${candidateLabel(best)}` : 'candidate: -';
      updatePlot();
    }

    async function runLoop() {
      const n = parseInt(el.n.value, 10);
      const type = el.bit.value;
      const mode = el.selmode.value;
      if (!isPowerOfTwo(n)) {
        logLine('[error] N は 2 の冪を前提にしています。');
        running = false;
        el.start.disabled = false;
        el.stop.disabled = true;
        setState('error', 'bad');
        return;
      }

      const baseInput = buildInput(n, INPUT_SEED);
      const ref = fftReference(baseInput.re, baseInput.im);
      generation = 0;
      history = [];
      elite = { ...randomCandidate(n, type), tableBits: type === 'f32' ? 12 : 28, permMode: 0, strideOdd: 1, n2Bits: log2Int(n >>> 1) };
      setState('初期化', 'ok');
      logLine(`START N=${n} type=${type}`);
      logLine(`seed elite: ${candidateLabel(elite)}`);

      while (running) {
        generation++;
        const child = mutateCandidate(elite, n, type, mode);
        el.candInfo.textContent = `trial: ${candidateLabel(child)}`;
        setState('compile', 'ok');
        try {
          const result = await compileAndRunCandidate(n, type, child, baseInput, ref);
          const record = { gen: generation, cmp: result.compileMs, run: result.avgRun, err: result.nrmse, cand: child, binaryBytes: result.binaryBytes };
          history.push(record);
          logLine(`gen ${generation} | cmp=${result.compileMs.toFixed(1)}ms | run=${result.avgRun.toFixed(4)}ms | nrmse=${result.nrmse.toExponential(3)} | size=${(result.binaryBytes / 1024 / 1024).toFixed(2)}MB | ${candidateLabel(child)}`);
          if (shouldAccept(record, elite, mode)) {
            elite = { ...child, cmp: record.cmp, run: record.run, err: record.err, binaryBytes: record.binaryBytes };
            setState('accept', 'ok');
          } else {
            setState('reject', 'bad');
          }
          updateStats(elite, record);
          await nextFrame();
        } catch (e) {
          console.error(e);
          logLine(`[fatal] gen ${generation}: ${e && e.message ? e.message : String(e)}`);
          setState('error', 'bad');
          running = false;
          break;
        }
      }

      el.start.disabled = false;
      el.stop.disabled = true;
      setState('停止');
      logLine('STOP');
    }

    function resetAll() {
      running = false;
      generation = 0;
      elite = null;
      history = [];
      el.gen.textContent = '0';
      el.best.textContent = '-';
      el.lastErr.textContent = '-';
      el.avgRun.textContent = '-';
      el.avgCmp.textContent = '-';
      el.candInfo.textContent = 'candidate: -';
      el.log.textContent = '';
      setState('待機');
      updatePlot();
    }

    el.start.addEventListener('click', async () => {
      if (running) return;
      running = true;
      el.start.disabled = true;
      el.stop.disabled = false;
      setState('wabt load');
      try {
        if (!wabt) wabt = await WABT();
        setState('run', 'ok');
        runLoop();
      } catch (e) {
        console.error(e);
        logLine(`[fatal] wabt load failed: ${e && e.message ? e.message : String(e)}`);
        running = false;
        el.start.disabled = false;
        el.stop.disabled = true;
        setState('load failed', 'bad');
      }
    });

    el.stop.addEventListener('click', () => {
      running = false;
      setState('停止中');
    });

    el.reset.addEventListener('click', resetAll);
    el.n.addEventListener('change', resetAll);
    el.bit.addEventListener('change', resetAll);

    resetAll();
    logLine('Ready. Start を押すと自己回帰探索を開始します。');
    logLine('N は 2048 を含む 2 の冪を用意済みです。');
  </script>
</body>
