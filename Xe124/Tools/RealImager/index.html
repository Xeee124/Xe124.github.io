<!-- File: RealImager.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RealImager</title>
<link rel="stylesheet" href="RealImager.css">
</head>
<body>
<div id="app">
  <header>
    <h1>RealImager</h1>
    <p class="sub">SO(2)回転のみ・Mid完全保存・パワー完全保存</p>
  </header>

  <section class="card">
    <h2>1. 入力</h2>
    <input type="file" id="fileInput" accept="audio/*">
    <div class="row">
      <button id="useMic">マイク入力</button>
      <button id="useDemo">デモ信号</button>
    </div>
  </section>

  <section class="card">
    <h2>2. モード</h2>
    <div class="seg">
      <button class="seg-btn active" data-mode="online">オンライン (式2)</button>
      <button class="seg-btn" data-mode="offline">オフライン (式3)</button>
    </div>
  </section>

  <section class="card">
    <h2>3. θ（広さ角）</h2>
    <div class="theta-display">
      <span id="thetaDeg">0°</span>
      <span class="hint" id="thetaHint">恒等変換（原音）</span>
    </div>
    <input type="range" id="thetaSlider" min="-180" max="180" step="0.5" value="0">
    <div class="row">
      <button data-theta="0">0°</button>
      <button data-theta="45">+45°</button>
      <button data-theta="90">+90°</button>
      <button data-theta="-45">-45°</button>
      <button data-theta="-90">-90°</button>
    </div>
  </section>

  <section class="card">
    <h2>4. 再生</h2>
    <div class="row">
      <button id="playBtn">▶ 再生</button>
      <button id="stopBtn">■ 停止</button>
      <button id="bypassBtn">バイパス</button>
    </div>
    <div class="row">
      <label>出力ゲイン
        <input type="range" id="gain" min="0" max="1" step="0.01" value="0.8">
      </label>
    </div>
  </section>

  <section class="card">
    <h2>5. 不変量メーター</h2>
    <div class="meter">
      <span class="lbl">Mid誤差</span>
      <div class="bar"><div id="midErr" class="fill"></div></div>
      <span id="midErrVal">-∞ dB</span>
    </div>
    <div class="meter">
      <span class="lbl">パワー誤差</span>
      <div class="bar"><div id="powErr" class="fill"></div></div>
      <span id="powErrVal">-∞ dB</span>
    </div>
    <div class="meter">
      <span class="lbl">LR相関</span>
      <div class="bar"><div id="corr" class="fill"></div></div>
      <span id="corrVal">0.00</span>
    </div>
  </section>

  <section class="card">
    <h2>6. オフライン処理</h2>
    <div class="row">
      <button id="renderBtn">θで全長レンダリング</button>
      <button id="downloadBtn" disabled>WAV ダウンロード</button>
    </div>
    <p class="hint">式3（FFTベース・遅延ゼロ・帯域端誤差最小）でファイル全体を変換します。</p>
  </section>

  <footer>
    <p class="hint">Mid = (L+R)/2 を完全保存。Side を (S, Ŝ) 平面で θ 回転のみ。</p>
  </footer>
</div>

<script src="RealImager_core.js"></script>
<script src="RealImager_offline.js"></script>
<script src="RealImager_online.js"></script>
<script src="RealImager_ui.js"></script>
</body>
</html>
