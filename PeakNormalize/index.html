<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEAK // NORMALIZE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --neon:#39FF14;
  --black:#000000;
  --white:#FFFFFF;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:#000;
  color:var(--white);
  font-family:"Noto Sans JP",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(1200px 800px at 50% -10%, #0d0d0d 0%, #000 55%, #000 100%),
    radial-gradient(800px 600px at 80% 120%, rgba(0,0,0,1) 0%, #000 60%);
  z-index:-3;
}
.scan{
  position:fixed; inset:0; pointer-events:none; z-index:5;
  background:repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(57,255,20,0.035) 2px, transparent 3px);
  opacity:.18; mix-blend-mode:screen;
}
.noise{
  position:fixed; inset:0; pointer-events:none; z-index:4;
  opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode:screen;
}
.orbs{position:fixed; inset:0; overflow:hidden; z-index:-2; pointer-events:none}
.orb{
  position:absolute; width:700px; height:700px; border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(57,255,20,0.9) 0%, rgba(57,255,20,0) 60%);
  filter:blur(120px); opacity:.15; will-change:transform;
  animation:drift 28s ease-in-out infinite alternate;
}
.orb1{top:-220px; left:-180px}
.orb2{bottom:-280px; right:-200px; animation-delay:-14s; animation-duration:32s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(90px,70px) scale(1.12)}}

.sparks{position:fixed; inset:0; pointer-events:none; z-index:3; overflow:hidden}
.spark{
  position:absolute; bottom:-10px; width:2px; height:2px; background:var(--neon);
  box-shadow:0 0 6px var(--neon), 0 0 12px rgba(57,255,20,0.8);
  opacity:0; animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0) translateX(0); opacity:0}
  5%{opacity:.9}
  90%{opacity:.9}
  100%{transform:translateY(-110vh) translateX(20px); opacity:0}
}

.wrap{max-width:1160px; margin:0 auto; padding:48px 20px 80px; position:relative; z-index:2}

header{text-align:center; padding:20px 0 30px}
.title{
  font-family:"Inter","Noto Sans JP",sans-serif;
  font-weight:900; font-size:clamp(42px,10vw,112px);
  line-height:.85; letter-spacing:.01em; text-transform:uppercase;
  color:var(--white);
  margin:0;
  text-shadow:
    0 0 2px #fff,
    0 0 18px rgba(57,255,20,0.55),
    0 0 36px rgba(57,255,20,0.35);
  position:relative; display:inline-block;
}
.title .s{color:var(--neon); text-shadow:0 0 15px var(--neon), 0 0 30px rgba(57,255,20,0.6)}
.title.glitch{transform:translate(1.5px,-1px) skewX(-3deg); text-shadow:-3px 0 var(--neon), 3px 0 #fff, 0 0 20px var(--neon), 0 0 40px rgba(57,255,20,0.8)}
.subtitle{margin-top:16px; color:rgba(255,255,255,0.68); font-size:14px; letter-spacing:.12em}

.panel{
  margin-top:38px;
  background:rgba(0,0,0,0.72);
  border:1px solid rgba(57,255,20,0.28);
  border-radius:8px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 0 1px rgba(57,255,20,0.06) inset, 0 20px 60px rgba(0,0,0,0.85);
  padding:24px;
  position:relative;
}
.panel::before{
  content:""; position:absolute; inset:0; border-radius:8px; pointer-events:none;
  background:linear-gradient(180deg, rgba(57,255,20,0.08), transparent 30%);
  opacity:.5;
}

.drop{
  position:relative;
  border:2px dashed rgba(57,255,20,0.38);
  background:#000;
  border-radius:8px;
  padding:54px 20px;
  text-align:center;
  cursor:pointer;
  transition:.18s ease;
  overflow:hidden;
}
.drop:hover, .drop.active{
  border-color:var(--neon);
  box-shadow:0 0 15px var(--neon), 0 0 30px rgba(57,255,20,0.6), inset 0 0 24px rgba(57,255,20,0.08);
}
.drop .ico{
  width:40px; height:40px; margin:0 auto 14px; color:var(--neon);
  filter:drop-shadow(0 0 10px rgba(57,255,20,0.9));
}
.drop .normal{font-weight:700; letter-spacing:.06em}
.drop .normal span{display:block; margin-top:6px; color:rgba(255,255,255,0.55); font-weight:400; font-size:13px; letter-spacing:.04em}
.drop .hover{
  display:none; font-family:"Inter",sans-serif; font-weight:900; font-size:34px; letter-spacing:.12em;
  color:var(--neon); text-shadow:0 0 15px var(--neon), 0 0 30px rgba(57,255,20,0.6);
}
.drop.active .normal{display:none}
.drop.active .hover{display:block}

.controls{
  display:flex; gap:16px; flex-wrap:wrap; align-items:center; justify-content:space-between;
  margin:20px 0 16px; padding:14px; background:#000; border:1px solid rgba(57,255,20,0.22); border-radius:6px;
}
.ctrl-left{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.slider{
  display:flex; align-items:center; gap:12px;
}
.slider label{font-size:12px; color:rgba(255,255,255,0.75); letter-spacing:.08em; text-transform:uppercase}
.slider .val{
  font-family:"Inter",monospace; font-weight:700; color:var(--neon);
  text-shadow:0 0 8px rgba(57,255,20,0.8); min-width:48px; text-align:right;
}
input[type="range"]{
  -webkit-appearance:none; appearance:none; width:220px; height:2px; background:rgba(255,255,255,0.15); outline:none;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#000; border:2px solid var(--neon);
  box-shadow:0 0 10px var(--neon), 0 0 20px rgba(57,255,20,0.5); cursor:pointer; margin-top:-7px;
}
input[type="range"]::-webkit-slider-runnable-track{height:2px; background:linear-gradient(90deg, rgba(57,255,20,0.8), rgba(57,255,20,0.2));}
input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#000;border:2px solid var(--neon);box-shadow:0 0 10px var(--neon);cursor:pointer}
input[type="range"]::-moz-range-track{height:2px;background:rgba(255,255,255,0.15)}

.btn{
  position:relative; display:inline-flex; align-items:center; gap:8px;
  padding:10px 16px; background:#000; color:var(--white);
  border:1px solid var(--neon); border-radius:6px;
  font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:12px;
  cursor:pointer; transition:.15s ease;
  box-shadow:0 0 12px rgba(57,255,20,0.25), inset 0 0 10px rgba(57,255,20,0.06);
  user-select:none;
}
.btn:hover{
  background:var(--neon); color:#000;
  box-shadow:0 0 15px var(--neon), 0 0 30px rgba(57,255,20,0.6);
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35; cursor:not-allowed; filter:grayscale(0.3)}
.btn.pulse{animation:venomPulse 3s ease-in-out infinite}
@keyframes venomPulse{
  0%,100%{box-shadow:0 0 12px rgba(57,255,20,0.25), inset 0 0 10px rgba(57,255,20,0.06)}
  50%{box-shadow:0 0 18px var(--neon), 0 0 34px rgba(57,255,20,0.7), inset 0 0 14px rgba(57,255,20,0.12)}
}
.btn .dot{width:6px;height:6px;background:var(--neon);box-shadow:0 0 8px var(--neon);border-radius:50%}
.btn:hover .dot{background:#000; box-shadow:none}

.table-wrap{
  margin-top:14px; border:1px solid rgba(57,255,20,0.22); border-radius:6px; overflow:hidden; background:#000;
}
table{width:100%; border-collapse:collapse; min-width:860px}
thead th{
  background:#000; color:rgba(255,255,255,0.72); font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  text-align:left; padding:12px 12px; border-bottom:1px solid rgba(57,255,20,0.32); font-weight:700; position:sticky; top:0; z-index:1;
}
tbody td{
  padding:12px; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; vertical-align:middle; color:#fff;
}
tbody tr:hover td{background:rgba(57,255,20,0.035)}
td.mono{font-family:"Inter",monospace; font-variant-numeric:tabular-nums}
td.val{color:var(--neon); text-shadow:0 0 6px rgba(57,255,20,0.65)}
td.name{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
canvas.wave{display:block; width:160px; height:44px; background:#000; border:1px solid rgba(57,255,20,0.22); border-radius:4px; box-shadow:inset 0 0 12px rgba(57,255,20,0.06)}
.dl{padding:6px 10px; font-size:11px}

.empty{
  margin-top:12px; padding:28px; text-align:center; color:rgba(255,255,255,0.55);
  border:1px dashed rgba(57,255,20,0.22); border-radius:6px; background:rgba(0,0,0,0.6);
}

.foot{margin:56px 0 20px; text-align:center; color:rgba(255,255,255,0.42); font-size:12px; letter-spacing:.18em}

*:focus-visible{outline:2px solid var(--neon); outline-offset:2px}

@media (max-width:720px){
  .controls{flex-direction:column; align-items:stretch}
  input[type="range"]{width:100%}
  .table-wrap{overflow-x:auto}
  .title{font-size:clamp(36px,12vw,72px)}
}
</style>
</head>
<body>
<div class="noise"></div>
<div class="scan"></div>
<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="sparks" id="sparks"></div>

<div class="wrap">
  <header>
    <h1 class="title" id="title">PEAK <span class="s">//</span> NORMALIZE</h1>
    <div class="subtitle">サンプルレート・ビット深度完全維持 — 毒のように正確に</div>
  </header>

  <main class="panel">
    <div id="drop" class="drop" tabindex="0" role="button" aria-label="WAVファイルをドロップ">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 3v12m0-12l-4 4m4-4l4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
        </svg>
      </div>
      <div class="normal">
        WAVファイルをドラッグ＆ドロップ
        <span>またはクリックして選択（複数可）</span>
      </div>
      <div class="hover">DROP VENOM</div>
      <input id="file" type="file" accept=".wav,audio/wav,audio/x-wav" multiple hidden>
    </div>

    <div class="controls">
      <div class="ctrl-left">
        <div class="slider">
          <label for="target">ターゲットピーク</label>
          <input id="target" type="range" min="-6" max="0" step="0.1" value="-0.1">
          <div class="val"><span id="targetVal">-0.1</span>dB</div>
        </div>
        <div style="color:rgba(255,255,255,0.55); font-size:12px">処理: <span id="count" class="mono" style="color:var(--neon); text-shadow:0 0 6px rgba(57,255,20,.6)">0</span> ファイル</div>
      </div>
      <div style="display:flex; gap:10px">
        <button id="zipBtn" class="btn" disabled><span class="dot"></span>ZIP一括ダウンロード</button>
        <button id="clearBtn" class="btn">全てクリア</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ファイル名</th>
            <th>SR</th>
            <th>Bit</th>
            <th>Ch</th>
            <th>元Peak</th>
            <th>ゲイン</th>
            <th>波形</th>
            <th>DL</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="empty" class="empty">ファイル未選択 — ドロップで即時処理開始</div>
  </main>

  <div class="foot">ENERGY × BEAUTY — 歪みなく、ただ鋭く。</div>
</div>

<script>
// sparks
const sparks = document.getElementById('sparks');
for(let i=0;i<22;i++){
  const s=document.createElement('div');
  s.className='spark';
  s.style.left = Math.random()*100 + '%';
  s.style.animationDuration = (5+Math.random()*4)+'s';
  s.style.animationDelay = (Math.random()*5)+'s';
  sparks.appendChild(s);
}

// glitch title
const title = document.getElementById('title');
setInterval(()=>{
  title.classList.add('glitch');
  setTimeout(()=>title.classList.remove('glitch'), 120);
}, 3400 + Math.random()*1200);

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const tbody = document.getElementById('tbody');
const empty = document.getElementById('empty');
const target = document.getElementById('target');
const targetVal = document.getElementById('targetVal');
const zipBtn = document.getElementById('zipBtn');
const clearBtn = document.getElementById('clearBtn');
const countEl = document.getElementById('count');

let audioCtx;
let processed = [];

target.addEventListener('input', ()=> targetVal.textContent = Number(target.value).toFixed(1));

drop.addEventListener('click', ()=> fileInput.click());
drop.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileInput.click(); }});
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('active'); });
drop.addEventListener('dragleave', ()=> drop.classList.remove('active'));
drop.addEventListener('drop', async e=>{
  e.preventDefault(); drop.classList.remove('active');
  const files = Array.from(e.dataTransfer.files||[]).filter(f=>/\.wav$/i.test(f.name));
  await handleFiles(files);
});
fileInput.addEventListener('change', async e=>{
  const files = Array.from(e.target.files||[]);
  await handleFiles(files);
  fileInput.value='';
});

clearBtn.addEventListener('click', ()=>{
  processed.forEach(p=>URL.revokeObjectURL(p.url));
  processed = []; tbody.innerHTML=''; updateUI();
});

zipBtn.addEventListener('click', async ()=>{
  if(processed.length===0) return;
  zipBtn.disabled = true;
  const zip = new JSZip();
  processed.forEach(p=>{
    const name = p.file.name.replace(/\.wav$/i,'') + '_normalized.wav';
    zip.file(name, p.blob);
  });
  const blob = await zip.generateAsync({type:'blob'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'peak_normalized_venom.zip';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  zipBtn.disabled = false;
});

async function handleFiles(files){
  if(!files.length) return;
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') await audioCtx.resume();
  for(const f of files){
    try{ await processFile(f); }catch(err){ console.error(err); }
  }
}

function updateUI(){
  countEl.textContent = processed.length;
  empty.style.display = processed.length ? 'none' : 'block';
  zipBtn.disabled = processed.length===0;
  if(processed.length>0) zipBtn.classList.add('pulse'); else zipBtn.classList.remove('pulse');
}

function getString(view, offset, length){
  let s=''; for(let i=0;i<length;i++) s+=String.fromCharCode(view.getUint8(offset+i)); return s;
}
function writeString(view, offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }

function parseWavHeader(ab){
  const v = new DataView(ab);
  if(getString(v,0,4)!=='RIFF' || getString(v,8,4)!=='WAVE') throw new Error('WAVではありません');
  let offset = 12;
  let audioFormat=1, channels=1, sampleRate=44100, bits=16;
  let dataOffset=0, dataSize=0;
  while(offset+8 <= v.byteLength){
    const id = getString(v, offset, 4);
    const size = v.getUint32(offset+4, true);
    if(id==='fmt '){
      audioFormat = v.getUint16(offset+8, true);
      channels = v.getUint16(offset+10, true);
      sampleRate = v.getUint32(offset+12, true);
      bits = v.getUint16(offset+22, true);
    }else if(id==='data'){
      dataOffset = offset+8;
      dataSize = size;
      break;
    }
    offset += 8 + size;
  }
  if(!dataOffset) throw new Error('dataチャンク無し');
  return {audioFormat, channels, sampleRate, bits, dataOffset, dataSize};
}

async function processFile(file){
  const ab = await file.arrayBuffer();
  const hdr = parseWavHeader(ab);
  if(![1,3].includes(hdr.audioFormat)) throw new Error('PCM/Floatのみ対応');
  if(![16,24,32].includes(hdr.bits)) throw new Error('16/24/32bitのみ');

  const audioBuf = await audioCtx.decodeAudioData(ab.slice(0));
  let peak = 0;
  for(let ch=0; ch<audioBuf.numberOfChannels; ch++){
    const d = audioBuf.getChannelData(ch);
    for(let i=0;i<d.length;i++){ const a=Math.abs(d[i]); if(a>peak) peak=a; }
  }
  const targetDb = parseFloat(target.value);
  const targetLin = Math.pow(10, targetDb/20);
  const gain = peak>0 ? targetLin/peak : 1;
  const gainDb = 20*Math.log10(gain);

  const outAb = encodeWav(audioBuf, hdr, gain);
  const blob = new Blob([outAb], {type:'audio/wav'});
  const url = URL.createObjectURL(blob);

  const item = {file, blob, url, hdr, peak, gain, peakDb: peak>0?20*Math.log10(peak):-Infinity, gainDb};
  processed.push(item);
  addRow(item, audioBuf);
  updateUI();
}

function encodeWav(audioBuffer, hdr, gain){
  const numChannels = hdr.channels;
  const sampleRate = hdr.sampleRate;
  const bits = hdr.bits;
  const audioFormat = hdr.audioFormat;
  const bytesPerSample = bits/8;
  const length = audioBuffer.length;
  const dataSize = length * numChannels * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  writeString(view,0,'RIFF');
  view.setUint32(4, 36+dataSize, true);
  writeString(view,8,'WAVE');
  writeString(view,12,'fmt ');
  view.setUint32(16,16,true);
  view.setUint16(20,audioFormat,true);
  view.setUint16(22,numChannels,true);
  view.setUint32(24,sampleRate,true);
  view.setUint32(28, sampleRate*numChannels*bytesPerSample, true);
  view.setUint16(32, numChannels*bytesPerSample, true);
  view.setUint16(34, bits, true);
  writeString(view,36,'data');
  view.setUint32(40,dataSize,true);

  let offset=44;
  for(let i=0;i<length;i++){
    for(let ch=0; ch<numChannels; ch++){
      const chan = audioBuffer.getChannelData(ch);
      let s = chan[i] * gain;
      if(s>1) s=1; if(s<-1) s=-1;
      if(audioFormat===3){
        view.setFloat32(offset, s, true); offset+=4;
      }else if(bits===16){
        view.setInt16(offset, s<0? s*0x8000 : s*0x7FFF, true); offset+=2;
      }else if(bits===24){
        const v = Math.round(s<0? s*8388608 : s*8388607);
        view.setUint8(offset, v & 0xFF);
        view.setUint8(offset+1, (v>>8) & 0xFF);
        view.setUint8(offset+2, (v>>16) & 0xFF);
        offset+=3;
      }else if(bits===32){
        view.setInt32(offset, s<0? s*0x80000000 : s*0x7FFFFFFF, true); offset+=4;
      }
    }
  }
  return buffer;
}

function addRow(item, audioBuf){
  const tr = document.createElement('tr');
  const peakTxt = item.peak>0 ? item.peakDb.toFixed(2) : '-∞';
  const gainTxt = (item.gainDb>=0?'+':'') + item.gainDb.toFixed(2);

  tr.innerHTML = `
    <td class="name" title="${item.file.name}">${item.file.name}</td>
    <td class="mono val">${item.hdr.sampleRate}</td>
    <td class="mono val">${item.hdr.bits}${item.hdr.audioFormat===3? 'f':''}</td>
    <td class="mono val">${item.hdr.channels}</td>
    <td class="mono">${peakTxt}</td>
    <td class="mono val">${gainTxt}</td>
    <td><canvas class="wave" width="160" height="44"></canvas></td>
    <td><button class="btn dl">保存</button></td>
  `;
  tbody.prepend(tr);
  const canvas = tr.querySelector('canvas');
  drawWave(canvas, audioBuf, item.gain);
  tr.querySelector('.dl').addEventListener('click', ()=>{
    const a=document.createElement('a');
    a.href=item.url;
    a.download=item.file.name.replace(/\.wav$/i,'')+'_norm.wav';
    a.click();
  });
}

function drawWave(canvas, buffer, gain){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
  const data = buffer.getChannelData(0);
  const step = Math.max(1, Math.floor(data.length / w));
  const amp = (h/2) * 0.9;

  // before - low opacity neon
  ctx.beginPath();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(57,255,20,0.18)';
  for(let x=0;x<w;x++){
    const start = x*step;
    let min=1, max=-1;
    for(let i=0;i<step;i+=Math.max(1, Math.floor(step/8))){
      const s = data[start+i]||0;
      if(s<min) min=s; if(s>max) max=s;
    }
    ctx.moveTo(x, h/2 + min*amp);
    ctx.lineTo(x, h/2 + max*amp);
  }
  ctx.stroke();

  // after - full neon with glow
  ctx.beginPath();
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = '#39FF14';
  ctx.shadowColor = '#39FF14';
  ctx.shadowBlur = 11;
  for(let x=0;x<w;x++){
    const start = x*step;
    let min=1, max=-1;
    for(let i=0;i<step;i+=Math.max(1, Math.floor(step/8))){
      const s = (data[start+i]||0) * gain;
      const c = s>1?1:s<-1?-1:s;
      if(c<min) min=c; if(c>max) max=c;
    }
    ctx.moveTo(x, h/2 + min*amp);
    ctx.lineTo(x, h/2 + max*amp);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

updateUI();
</script>
