<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>Oscilloscope</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="app">
        <div class="bar collapsed" id="topBar">
            <button id="menu-toggle">☰</button>

            <div class="grp grp-essential">
                <button id="btn-audio" class="on">Audio開始</button>
                <button id="btn-file">📂</button>
                <input type="file" id="file-input" accept="audio/*,video/*" />
                <button id="btn-mic">🎤</button>
                <button id="btn-sys">🖥</button>
            </div>

            <div class="grp grp-essential">
                <button id="btn-play" disabled>▶</button>
                <button id="btn-stop" disabled>■</button>
            </div>

            <div class="grp">
                <label class="sm">FPS</label>
                <select id="sel-fps">
                    <option value="0">AUTO</option>
                    <option value="30">30</option>
                    <option value="60">60</option>
                    <option value="120">120</option>
                    <option value="144">144</option>
                    <option value="240">240</option>
                </select>
                <label class="sm">Mode</label>
                <select id="sel-mode">
                    <option value="time" selected>TIME</option>
                    <option value="lissajous">XY</option>
                    <option value="dual">DUAL</option>
                    <option value="mirror">MIRROR</option>
                </select>
                <label class="sm">Ch</label>
                <select id="sel-ch">
                    <option value="mix" selected>MIX</option>
                    <option value="left">L</option>
                    <option value="right">R</option>
                    <option value="mid">MID</option>
                    <option value="side">SIDE</option>
                </select>
            </div>

            <div class="grp">
                <label class="sm">Trig</label>
                <select id="sel-trig">
                    <option value="nsdf" selected>NSDF</option>
                    <option value="zero">ZERO</option>
                    <option value="peak">PEAK</option>
                    <option value="free">FREE</option>
                </select>
                <label class="sm">Slope</label>
                <select id="sel-slope">
                    <option value="rising" selected>↑</option>
                    <option value="falling">↓</option>
                    <option value="both">↕</option>
                </select>
                <label class="sm">Thresh</label>
                <input type="range" id="rng-thresh" min="0" max="100" value="8" style="width:50px" />
                <label class="sm">Holdoff</label>
                <input type="range" id="rng-holdoff" min="0" max="200" value="20" style="width:50px" />
            </div>

            <div class="grp">
                <label class="sm">Zoom</label>
                <input type="range" id="rng-zoom" min="1" max="16" step="0.5" value="1" style="width:50px" />
                <label class="sm">Gain</label>
                <input type="range" id="rng-gain" min="10" max="400" value="100" style="width:50px" />
                <label class="sm">Smooth</label>
                <input type="range" id="rng-smooth" min="0" max="95" value="15" style="width:50px" />
                <label class="sm">Persist</label>
                <input type="range" id="rng-persist" min="0" max="98" value="85" style="width:50px" />
                <label class="sm">Thick</label>
                <input type="range" id="rng-thick" min="1" max="6" step="0.5" value="1.5" style="width:45px" />
            </div>

            <div class="grp">
                <button id="btn-grid" class="on">Grid</button>
                <button id="btn-glow" class="on">Glow</button>
                <button id="btn-stats" class="on">Stats</button>
                <label class="sm">Color</label>
                <select id="sel-color">
                    <option value="gradient" selected>Grad</option>
                    <option value="cyan">Cyan</option>
                    <option value="green">Green</option>
                    <option value="magenta">Mag</option>
                    <option value="white">White</option>
                </select>
                <button id="btn-fs">⛶</button>
                <button id="btn-reset" class="danger">Reset</button>
            </div>
        </div>

        <div id="main">
            <canvas id="gl-canvas"></canvas>
            <canvas id="overlay-cv"></canvas>
        </div>

        <div class="footer">
            <div class="grp grow" style="gap:4px">
                <button id="btn-tp" disabled style="min-width:24px;padding:4px 6px">▶</button>
                <input type="range" id="seekbar" min="0" max="1" step="0.0001" value="0" disabled />
                <span id="time-dsp">0:00/0:00</span>
            </div>

            <div class="grp" id="stats-bar" style="gap:8px">
                <span class="stat" id="st-fps">--fps</span>
                <span class="stat" id="st-lat">--ms</span>
                <span class="stat" id="st-trig">T:--</span>
                <span class="stat" id="st-amp">A:--</span>
                <span class="stat" id="st-src">none</span>
            </div>
        </div>
    </div>

    <div id="drop-overlay">🎵 Drop audio file</div>

    <script src="sketch.js"></script>

</body>

</html>
