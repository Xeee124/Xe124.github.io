<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TUN File Generator</title>
<style>
body {
background-color: #121212;
color: #e0e0e0;
font-family: sans-serif;
padding: 20px;
}
input, button {
background-color: #2c2c2c;
color: #ffffff;
border: 1px solid #444;
padding: 8px;
margin: 5px 0;
border-radius: 4px;
}
button {
cursor: pointer;
background-color: #005f9e;
}
button:hover {
background-color: #007bb5;
}
.container {
max-width: 500px;
margin: 0 auto;
display: flex;
flex-direction: column;
}
label {
margin-top: 10px;
}
</style>
</head>
<body>
<div class="container">
<h2>TUN File Generator</h2>
<label for="sampleRate">サンプリング周波数:</label>
<input type="number" id="sampleRate" value="48000">

<label for="frameValue">1フレームのサンプル数 または 音階 (例: 4096, Cb2):</label>
<input type="text" id="frameValue" value="4096">

<button onclick="generateTun()">生成してダウンロード</button>
</div>

<script>
function parseNote(noteStr) {
const match = noteStr.match(/^([A-Ga-g])([#♯b♭]*)(-?\d+)$/);
if (!match) return null;

const baseNotes = { 'c': 0, 'd': 2, 'e': 4, 'f': 5, 'g': 7, 'a': 9, 'b': 11 };
let note = baseNotes[match[1].toLowerCase()];

const acc = match[2];
for (let i = 0; i < acc.length; i++) {
if (acc[i] === '#' || acc[i] === '♯') note += 1;
else if (acc[i] === 'b' || acc[i] === '♭') note -= 1;
}

const octave = parseInt(match[3], 10);
return note + (octave + 1) * 12;
}

function generateTun() {
const sampleRateStr = document.getElementById('sampleRate').value;
const frameValueStr = document.getElementById('frameValue').value;
const sampleRate = parseFloat(sampleRateStr);

let freq = 0;
const parsedNote = parseNote(frameValueStr);

if (parsedNote !== null) {
freq = 440 * Math.pow(2, (parsedNote - 69) / 12);
} else {
const samples = parseFloat(frameValueStr);
if (isNaN(samples) || samples <= 0) {
alert("無効な入力です。");
return;
}
freq = sampleRate / samples;
}

const baseFreq = 440 * Math.pow(2, -69 / 12);
const cent = 1200 * (Math.log(freq / baseFreq) / Math.LN2);

const cleanCentStr = cent.toString();
const intCent = Math.round(cent);

const dateStr = new Date().toISOString().split('T')[0];

let content = `; VAZ Plus/AnaMark softsynth tuning file\n;\n;\n; https://sevish.com/scaleworkshop/?f=b.pvi&version=2.5.7\n;\n;\nVAZ Plus section\n[Tuning]\n`;
for (let i = 0; i < 128; i++) {
content += `note ${i}=${intCent}\n`;
}

content += `\n;\nAnaMark section\n[Scale Begin]\nFormat= "AnaMark-TUN"\nFormatVersion= 100\nFormatSpecs= "http://www.mark-henning.de/eternity/tuningspecs.html"\n\n[Info]\nName= "untitled scale.tun"\nID= "untitledscale.tun"\nFilename= "untitled scale.tun"\nDescription= ""\nDate= "${dateStr}"\nEditor= "Scale Workshop 2.5.7"\n\n[Exact Tuning]\n`;
for (let i = 0; i < 128; i++) {
content += `note ${i}= ${cleanCentStr}\n`;
}
content += `\n[Scale End]\n`;

// MIMEタイプを application/octet-stream に指定
const blob = new Blob([content], { type: 'application/octet-stream' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `WT_${sampleRateStr}_${frameValueStr}.tun`;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
URL.revokeObjectURL(url);
}
</script>
</body>
</html>
